<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <link href="../css/style.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registrazione</title>
    </head>
    <body class="pagina-form">
        <h1>Registrazione</h1>
        <form action="../php/registrazione.php" method="POST" novalidate>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" pattern="^[a-zA-Z0-9!@#$%^&*_-]{4,32}$" required>
            <!-- https://regex101.com/ per la costruzione delle espressioni regolari -->

            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" pattern="^[a-zA-Z0-9!@#$%^&*_-]{8,64}$" required>

            <br><br>

            <label for="confirm_password">Conferma Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <br><br>

            <button type="submit">Registrati</button>
        </form>
        <p>
            Sei gia' registrato?
            <a href="../index.html">Accedi</a>
        </p>
        <script src="../js/messaggi.js"></script>
        <script src="../js/ui.js"></script>
    </body>
</html>
